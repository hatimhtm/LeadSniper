name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    name: Dashboard · Next build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        # Provide harmless placeholders so the dashboard's supabase client
        # initialiser doesn't throw at module-load during the build pass.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  scraper:
    name: Scraper · syntax + import check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - name: Install
        run: npm ci
      - name: Syntax-check every source file
        # `node --check` parses without executing — perfect for CLI entrypoints
        # like src/index.js whose `program.parse()` would otherwise error on
        # missing-required-arg if we tried `import()`. Bare imports (the only
        # other class of error this check can miss) are caught by the
        # dashboard job which actually executes its imports during `next build`.
        run: |
          for f in src/*.js; do
            echo "→ checking $f"
            node --check "$f" || exit 1
          done
